[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
app-core = { path = "../core" }
revision-scheduler = { path = "../revision-scheduler" }

sqlx = {
    version = "0.8",
    features = [
        "runtime-tokio",
        "sqlite",
        "uuid",
        "migrate",
    ]
}
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
